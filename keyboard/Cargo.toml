[package]
edition = "2021"
name = "keyboard"
version = "0.2.0"

[features]
default = ["macropad"]
cli = []
ansi = []
iso = []
jis = []
numpad = []
macropad = []

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
embedded-hal.workspace = true
embedded-hal-02 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"] }

defmt.workspace = true
defmt-rtt.workspace = true

#panic-probe.workspace = true
rp2040-panic-usb-boot.workspace = true

# Not using an external BSP, we've got the Framework Laptop 16 BSPs locally in this crate
rp2040-hal.workspace = true
rp2040-boot2.workspace = true

# USB Serial
usb-device.workspace = true
heapless.workspace = true
usbd-serial.workspace = true
fugit.workspace = true

usbd-human-interface-device = "0.6.0"
is31fl3743a.workspace = true

cfg-if = "1.0.0"

[dependencies.fl16-inputmodules]
path = "../fl16-inputmodules"
features = ["keyboard"]
